[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygenmod"
version = "1.4.0"
authors = [
  { name="LiHao" },
]
description = "Python companion and analysis toolkit for the GeneralModule Fortran quantum dynamics library"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.3",
]

[tool.setuptools]
# 显式声明包列表，避免 flat-layout 自动发现在目录结构变化时把
# examples/ 等脚本目录误当作包。
packages = ["pygenmod"]
