name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Fortran Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake

      - name: Setup Fortran Compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc cmake || true
          which gfortran || true
          gfortran --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Build and Test via CMake (46 Test Suites, 36 Examples)
        run: |
          cmake -B build -S .
          cmake --build build -j 4
          set +e
          ctest --test-dir build --output-on-failure > ctest_full.log 2>&1
          rc=$?
          set -e
          tail -n 60 ctest_full.log
          if [ $rc -ne 0 ]; then
            # 失败测试名与断言详情转发为 workflow 注解: 运行页公开可见,
            # 无需登录下载日志即可诊断平台相关失败。多行内容用 %0A 编码
            # 打包进少量注解, 规避面板 10 条显示上限的截断。
            echo "::error::ctest failed with exit code $rc"
            failed_list="$(grep -aA 40 'The following tests FAILED' ctest_full.log | head -n 25)"
            failed_list="${failed_list//$'\n'/%0A}"
            echo "::error::FAILED TESTS: ${failed_list}"
            ctest --test-dir build --rerun-failed --output-on-failure > ctest_rerun.log 2>&1 || true
            detail="$(grep -aE '\[FAIL\]|Got:|Expected:|Diff:|Fortran runtime error|Error termination' ctest_rerun.log | head -n 40)"
            detail="${detail//$'\n'/%0A}"
            echo "::error::FAILING ASSERTIONS: ${detail}"
            tailn="$(tail -n 10 ctest_rerun.log)"
            tailn="${tailn//$'\n'/%0A}"
            echo "::error::RERUN TAIL: ${tailn}"
          fi
          exit $rc

      - name: Run Direct Fortran Unit Test Suite (46 Test Suites, 393 Assertions)
        run: |
          bash tests/run_all_tests.sh

      - name: Run OpenMP Build & Test Suite (parallel path regression)
        run: |
          make OPENMP=1 test

      - name: Build & Run Frontier Physical Examples (36 Examples)
        run: |
          bash examples/build_examples.sh

      - name: Run Python Package Unit Tests (pygenmod, 28 Tests)
        run: |
          python3 python/test_pygenmod.py

      - name: Run Textbook Correctness Audit (offline)
        run: |
          python3 docs/audit_textbook.py

      - name: Run Rovibrational Dynamics Visualization Pipeline
        run: |
          python3 python/plot_rovibrational_dynamics.py
